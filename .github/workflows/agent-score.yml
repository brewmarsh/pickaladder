name: Agent Readiness Score

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  agent-score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Run agent-score (diff)
        run: |
          uv tool run --from agent-readiness-scorecard \
          --with tree-sitter \
          --with tree-sitter-javascript \
          --with tree-sitter-typescript \
          --with tree-sitter-python \
          agent-score score --diff --diff-base origin/main . --limit-to .py
