# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0 # Use modern ruff version matching environment
    hooks:
      # Run the linter against all staged Python files.
      - id: ruff
        args: [--fix] # Automatically fix fixable errors

      # Run the formatter against all staged Python files.
      - id: ruff-format

  # 3. Bandit (Optional but recommended for security)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7 # Use the latest stable version
    hooks:
      - id: bandit
        args: ['-ll', '-x', 'tests']

  # 4. Local Hooks: Run mypy and unit tests
  - repo: local
    hooks:
      - id: run-mypy
        name: Run MyPy (Local)
        entry: uv run python -m mypy
        language: system
        types: [python]
      - id: run-tests
        name: Run Unit Tests
        entry: uv run pytest --ignore=tests/e2e
        language: system
        types: [python]
        pass_filenames: false
